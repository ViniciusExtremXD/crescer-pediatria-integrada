<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>OG image (renderizar em 1200x630)</title>
<style>
  @font-face { font-family: "Fraunces"; src: url("../assets/fonts/fraunces-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "Fraunces"; src: url("../assets/fonts/fraunces-latin-wght-italic.woff2") format("woff2"); font-weight: 100 900; font-style: italic; }
  @font-face { font-family: "Nunito Sans"; src: url("../assets/fonts/nunito-sans-latin-wght-normal.woff2") format("woff2"); font-weight: 200 1000; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    font-family: "Nunito Sans", sans-serif;
    color: #0e332e;
    background:
      radial-gradient(700px 420px at 95% 0%, #fbe6e9, transparent 60%),
      radial-gradient(600px 420px at 0% 100%, #e8f1ec, transparent 60%),
      #fff9f2;
  }
  .wrap { position: absolute; inset: 0; padding: 64px 72px; display: flex; flex-direction: column; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .brand svg { width: 64px; height: 64px; }
  .brand b { font-family: "Fraunces", serif; font-weight: 600; font-size: 44px; letter-spacing: -0.02em; color: #174b43; line-height: 1; display: block; }
  .brand span { display: block; margin-top: 6px; font-size: 15px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: #a9435a; }
  h1 { font-family: "Fraunces", serif; font-weight: 600; font-size: 92px; line-height: 1.02; letter-spacing: -0.02em; max-width: 720px; }
  h1 em { color: #a9435a; font-weight: 500; }
  .foot { display: flex; align-items: center; gap: 14px; font-size: 24px; font-weight: 700; color: #1d5b52; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #d97788; }
  .arch {
    position: absolute; right: 70px; top: 70px; width: 330px; height: 490px;
    border-radius: 999px 999px 32px 32px;
    background: linear-gradient(170deg, #d3e5db, #9fc2b1);
    box-shadow: 0 30px 60px rgba(14, 51, 46, .18);
    display: grid; place-items: center;
  }
  .arch::before { content: ""; position: absolute; inset: 14px; border: 2px dashed rgba(255,255,255,.8); border-radius: 999px 999px 22px 22px; }
  .arch svg { width: 200px; height: 200px; filter: drop-shadow(0 14px 24px rgba(14,51,46,.2)); }
</style>
</head>
<body>
  <div class="arch">
    <svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="58" fill="#fff3ef"/><path d="M82 36C64 22 36 30 33 56c-2 24 19 40 41 28" fill="none" stroke="#d97788" stroke-width="7" stroke-linecap="round"/><circle cx="78" cy="86" r="9" fill="none" stroke="#d97788" stroke-width="6"/><path d="M70 29c-3-10-14-12-20-8 2 9 11 12 20 8z" fill="#1d5b52"/></svg>
  </div>
  <div class="wrap">
    <div class="brand">
      <svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="58" fill="#fff3ef"/><path d="M82 36C64 22 36 30 33 56c-2 24 19 40 41 28" fill="none" stroke="#d97788" stroke-width="7" stroke-linecap="round"/><circle cx="78" cy="86" r="9" fill="none" stroke="#d97788" stroke-width="6"/><path d="M70 29c-3-10-14-12-20-8 2 9 11 12 20 8z" fill="#1d5b52"/></svg>
      <div><b>Crescer</b><span>Pediatria Integrada</span></div>
    </div>
    <h1>Pediatria feita com <em>amor</em> e dedicação.</h1>
    <div class="foot"><span class="dot"></span>Clínica de especialidades pediátricas · Macapá, AP</div>
  </div>
</body>
</html>
